name: Release Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_modal_smoke:
        description: "Run protected live Modal smoke tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    name: Core checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install scan tools
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Install dependencies
        run: uv sync --extra dev --extra modal --frozen

      - name: Check OpenAPI schema freshness
        run: uv run python scripts/export_openapi.py --check

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Generate benchmark report
        run: uv run computer-use benchmark report --mock-local --iterations 5 --output benchmark-results/benchmark-report.json

      - name: Check repository hygiene
        run: uv run python scripts/check_repository_hygiene.py

      - name: Run boundary scans
        run: |
          ! rg "(^|[^A-Za-z0-9_])(import|from) +(openai|anthropic)" src
          ! rg "NetworkFileSystem" src
          ! rg -n "print\([^\n]*(vnc_url|debug\.vnc_url|\.uri|artifact_uri|token|data_base64|raw_path|stdout|stderr)" examples docs README.md

  minimum-dependencies:
    name: Minimum direct dependency checks
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve minimum direct dependencies
        run: uv lock --resolution lowest-direct

      - name: Install minimum direct dependencies
        run: uv sync --extra dev --extra modal --frozen

      - name: Type check
        run: uv run --frozen mypy src

      - name: Test
        run: uv run --frozen pytest -q

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: |
          test ! -e dist/release
          mkdir -p dist/release
          uv build --out-dir dist/release

      - name: Validate package metadata
        run: uvx --from 'twine>=6.2.0' twine check dist/release/*

      - name: Inspect distribution metadata
        run: uv run python scripts/check_distribution_metadata.py dist/release/*

      - name: Validate installed distributions
        run: uv run python scripts/smoke_distribution_install.py --distributions dist/release

  security:
    name: Dependency and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Export locked dependencies
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project \
            --output-file /tmp/modal-computer-use-audit-requirements.txt

      - name: Audit dependencies
        run: |
          uvx --python 3.12 --from 'pip-audit==2.10.1' pip-audit \
            --requirement /tmp/modal-computer-use-audit-requirements.txt \
            --no-deps --disable-pip

      - name: Scan Python source
        run: uvx --from 'bandit==1.9.4' bandit -q -lll -r src

      - name: Scan security rules
        run: uvx --from 'semgrep==1.172.0' semgrep scan --config p/security-audit --error src

  modal-smoke:
    name: Protected Modal smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_modal_smoke
    environment: modal-smoke
    timeout-minutes: 30
    concurrency:
      group: protected-modal-smoke
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra modal --frozen

      - name: Validate Modal secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::run_modal_smoke=true requires MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in the modal-smoke environment"
            exit 1
          fi

      - name: Run protected live Modal smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_COMPUTER_USE_RUN_NOVNC_SMOKE: "1"
          MODAL_COMPUTER_USE_RUN_V1_SMOKE: "1"
        run: uv run pytest -m modal tests/test_modal_integration.py -q
