name: Release Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_modal_smoke:
        description: "Run protected live Modal smoke tests"
        type: boolean
        default: false

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install scan tools
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Install dependencies
        run: uv sync --extra dev --extra modal

      - name: Check OpenAPI schema freshness
        run: uv run python scripts/export_openapi.py --check

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Generate benchmark report
        run: uv run computer-use benchmark report --mock-local --iterations 5 --output benchmark-report.json

      - name: Run boundary scans
        run: |
          ! rg "(^|[^A-Za-z0-9_])(import|from) +(openai|anthropic)" src
          ! rg "NetworkFileSystem" src
          ! rg -n "print\([^\n]*(vnc_url|debug\.vnc_url|\.uri|artifact_uri|token|data_base64|raw_path|stdout|stderr)" examples docs README.md

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.json

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Validate wheel install
        run: |
          uv venv /tmp/mcu-wheel-smoke --python 3.12
          uv pip install --python /tmp/mcu-wheel-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/mcu-wheel-smoke/bin/python - <<'PY'
          from pathlib import Path

          import modal_computer_use
          from modal_computer_use.daemon.app import create_app
          from modal_computer_use.daemon.settings import DaemonSettings

          app = create_app(
              DaemonSettings(
                  backend="mock",
                  artifacts_dir=Path("/tmp/mcu-wheel-smoke-artifacts"),
                  recordings_dir=Path("/tmp/mcu-wheel-smoke-recordings"),
                  local_token="dev",
              )
          )
          assert modal_computer_use.__version__
          assert app.title == "modal-computer-use daemon"
          PY
          /tmp/mcu-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          scripts = {ep.name: ep.value for ep in entry_points(group="console_scripts")}
          assert scripts["computer-use"] == "modal_computer_use.cli:main"
          assert scripts["computer-use-daemon"] == "modal_computer_use.daemon.__main__:main"
          PY
          /tmp/mcu-wheel-smoke/bin/computer-use --help >/tmp/mcu-computer-use-help.txt
          /tmp/mcu-wheel-smoke/bin/computer-use trace --help >/tmp/mcu-trace-help.txt
          /tmp/mcu-wheel-smoke/bin/computer-use benchmark action-batch --mock-local --iterations 1 >/tmp/mcu-benchmark.json

      - name: Validate installed daemon entry point
        run: |
          COMPUTER_USE_BACKEND=mock \
          COMPUTER_USE_LOCAL_TOKEN=dev \
          COMPUTER_USE_REQUIRE_CONNECT_USER=false \
          COMPUTER_USE_ARTIFACTS_DIR=/tmp/mcu-daemon-artifacts \
          COMPUTER_USE_RECORDINGS_DIR=/tmp/mcu-daemon-recordings \
          COMPUTER_USE_TRACE_DIR=/tmp/mcu-daemon-traces \
          /tmp/mcu-wheel-smoke/bin/computer-use-daemon >/tmp/mcu-daemon.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          /tmp/mcu-wheel-smoke/bin/python - <<'PY'
          import time

          import httpx

          headers = {"Authorization": "Bearer dev"}
          for _ in range(60):
              try:
                  assert httpx.get("http://127.0.0.1:8080/healthz", timeout=1).status_code == 200
                  assert httpx.get("http://127.0.0.1:8080/readyz", timeout=1).status_code == 200
                  assert httpx.get(
                      "http://127.0.0.1:8080/v1/version",
                      headers=headers,
                      timeout=1,
                  ).status_code == 200
                  assert httpx.get(
                      "http://127.0.0.1:8080/v1/capabilities",
                      headers=headers,
                      timeout=1,
                  ).status_code == 200
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError("installed daemon did not become ready")
          PY

      - name: Validate sdist install
        run: |
          uv venv /tmp/mcu-sdist-smoke --python 3.12
          uv pip install --python /tmp/mcu-sdist-smoke/bin/python dist/*.tar.gz
          cd /tmp
          /tmp/mcu-sdist-smoke/bin/python -c "import modal_computer_use; assert modal_computer_use.__version__"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  modal-smoke:
    name: Protected Modal smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_modal_smoke
    environment: modal-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra modal

      - name: Run protected live Modal smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_COMPUTER_USE_RUN_NOVNC_SMOKE: "1"
          MODAL_COMPUTER_USE_RUN_V1_SMOKE: "1"
        run: uv run pytest -m modal tests/test_modal_integration.py -q
