name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra modal --frozen

      - name: Validate release candidate
        run: >-
          uv run python scripts/check_release_candidate.py
          --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"
          --main-ref refs/remotes/origin/main

      - name: Build package once
        run: |
          test ! -e dist
          mkdir -p dist/release
          uv build --out-dir dist/release

      - name: Validate package metadata
        run: uvx --from 'twine>=6.2.0' twine check dist/release/*

      - name: Inspect distribution metadata
        run: uv run python scripts/check_distribution_metadata.py dist/release/*

      - name: Smoke-test distribution installs
        run: uv run python scripts/smoke_distribution_install.py --distributions dist/release

      - name: Prepare release bundle
        run: |
          uv run python scripts/check_release_bundle.py prepare \
            --distributions dist/release \
            --checksums dist/SHA256SUMS
          uv run python scripts/check_release_bundle.py verify \
            --distributions dist/release \
            --checksums dist/SHA256SUMS

      - name: Store release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-distributions
          path: dist
          if-no-files-found: error
          retention-days: 1

  protected-modal-smoke:
    name: Protected Modal release smokes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: modal-smoke
    concurrency:
      group: protected-modal-smoke
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      MODAL_COMPUTER_USE_HANDOFF_ENVIRONMENT: modal-computer-use-smoke
      MODAL_COMPUTER_USE_HANDOFF_REGION: us-west
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra modal --frozen

      - name: Validate Modal secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::the modal-smoke environment requires MODAL_TOKEN_ID and MODAL_TOKEN_SECRET"
            exit 1
          fi

      - name: Run protected live Modal smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_COMPUTER_USE_RUN_LIVE_TESTS: "1"
          MODAL_COMPUTER_USE_RUN_NOVNC_SMOKE: "1"
          MODAL_COMPUTER_USE_RUN_V1_SMOKE: "1"
        run: uv run pytest -m modal tests/test_modal_integration.py -q

      - name: Create private handoff run scope
        run: |
          scope="$(uv run python -c 'import secrets; print(secrets.token_hex(12))')"
          app_name="mcu-release-handoff-$scope"
          owner="mcu-release-handoff-owner-$scope"
          echo "::add-mask::$app_name"
          echo "::add-mask::$owner"
          echo "MODAL_COMPUTER_USE_HANDOFF_APP_NAME=$app_name" >> "$GITHUB_ENV"
          echo "MODAL_COMPUTER_USE_HANDOFF_OWNER=$owner" >> "$GITHUB_ENV"

      - name: Deploy protected Function handoff smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ env.MODAL_COMPUTER_USE_HANDOFF_ENVIRONMENT }}
        run: |
          if ! uv run modal deploy \
            --env "$MODAL_COMPUTER_USE_HANDOFF_ENVIRONMENT" \
            tests/modal_function_session_handoff_smoke_app.py >/dev/null 2>&1
          then
            echo "::error::protected Function handoff deployment failed"
            exit 1
          fi
          echo "MODAL_COMPUTER_USE_HANDOFF_DEPLOYED=1" >> "$GITHUB_ENV"

      - name: Run protected Function handoff smoke
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ env.MODAL_COMPUTER_USE_HANDOFF_ENVIRONMENT }}
          MODAL_COMPUTER_USE_RUN_LIVE_TESTS: "1"
          MODAL_COMPUTER_USE_RUN_HANDOFF_SMOKE: "1"
        run: |
          if ! uv run pytest -m modal tests/test_modal_integration.py \
            -k test_modal_deployed_function_session_handoff_smoke -q >/dev/null 2>&1
          then
            echo "::error::protected Function handoff smoke failed"
            exit 1
          fi
          echo "Protected Function handoff smoke passed"

      - name: Clean up protected Function handoff smoke
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ env.MODAL_COMPUTER_USE_HANDOFF_ENVIRONMENT }}
        run: |
          if [ -z "${MODAL_COMPUTER_USE_HANDOFF_APP_NAME:-}" ] || \
            [ -z "${MODAL_COMPUTER_USE_HANDOFF_OWNER:-}" ]
          then
            echo "Protected Function handoff cleanup was not required"
            exit 0
          fi

          target_cleanup_status=0
          app_cleanup_status=0
          uv run python - <<'PY' >/dev/null 2>&1 || target_cleanup_status=$?
          import os

          import modal

          owner = os.environ["MODAL_COMPUTER_USE_HANDOFF_OWNER"]
          for sandbox in modal.Sandbox.list(tags={"computer-use.owner": owner}):
              sandbox.terminate(wait=True)
          PY
          if [ "${MODAL_COMPUTER_USE_HANDOFF_DEPLOYED:-}" = "1" ]; then
            uv run modal app stop \
              --yes \
              --env "$MODAL_COMPUTER_USE_HANDOFF_ENVIRONMENT" \
              "$MODAL_COMPUTER_USE_HANDOFF_APP_NAME" >/dev/null 2>&1 || app_cleanup_status=$?
          fi

          if [ "$target_cleanup_status" -ne 0 ] || [ "$app_cleanup_status" -ne 0 ]
          then
            echo "::error::protected Function handoff cleanup failed"
            exit 1
          fi
          echo "Protected Function handoff cleanup completed"

  publish-testpypi:
    name: Publish release bundle to TestPyPI
    needs: [build, protected-modal-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/modal-computer-use
    permissions:
      id-token: write
    steps:
      - name: Retrieve release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist

      - name: Verify release bundle checksums
        working-directory: dist/release
        run: sha256sum --check ../SHA256SUMS

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/release
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI release bytes
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retrieve release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist

      - name: Verify TestPyPI files and provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/verify_python_index_release.py \
            --index-url https://test.pypi.org \
            --project modal-computer-use \
            --version "$version" \
            --distributions dist/release

  publish-pypi:
    name: Publish release bundle to PyPI
    needs: verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/modal-computer-use
    permissions:
      id-token: write
    steps:
      - name: Retrieve release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist

      - name: Verify release bundle checksums
        working-directory: dist/release
        run: sha256sum --check ../SHA256SUMS

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/release

  verify-pypi:
    name: Verify PyPI release bytes
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retrieve release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist

      - name: Verify PyPI files and provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/verify_python_index_release.py \
            --index-url https://pypi.org \
            --project modal-computer-use \
            --version "$version" \
            --distributions dist/release

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Verify clean PyPI installation
        run: |
          install_root="$(mktemp -d)"
          cd "$install_root"
          uv init --bare --python 3.12
          uv add "modal-computer-use[modal]"
          export EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          uv run python - <<'PY'
          import os
          from importlib.metadata import entry_points, version

          import modal_computer_use

          assert (
              version("modal-computer-use")
              == modal_computer_use.__version__
              == os.environ["EXPECTED_VERSION"]
          )
          scripts = {ep.name: ep.value for ep in entry_points(group="console_scripts")}
          assert scripts["computer-use"] == "modal_computer_use.cli:main"
          assert scripts["computer-use-daemon"] == "modal_computer_use.daemon.__main__:main"
          PY
          uv run computer-use --help

  github-release:
    name: Publish immutable GitHub Release
    needs: verify-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-distributions
          path: dist

      - name: Verify release bundle checksums
        working-directory: dist/release
        run: sha256sum --check ../SHA256SUMS

      - name: Verify current remote tag
        run: >-
          python3 scripts/check_github_release.py tag
          --tag "$GITHUB_REF_NAME"
          --expected-commit "$GITHUB_SHA"

      - name: Create or resume release
        id: release
        run: |
          release_state="$(
            python3 scripts/check_github_release.py state --tag "$GITHUB_REF_NAME"
          )"
          if [ "$release_state" = "missing" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-from-tag
            release_state="draft"
          fi
          echo "state=$release_state" >> "$GITHUB_OUTPUT"

      - name: Attach release assets
        if: steps.release.outputs.state == 'draft'
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/release/*.whl \
            dist/release/*.tar.gz \
            dist/SHA256SUMS \
            --clobber

      - name: Verify complete release asset set
        run: >-
          python3 scripts/check_github_release.py assets
          --tag "$GITHUB_REF_NAME"
          --distributions dist/release
          --checksums dist/SHA256SUMS

      - name: Publish draft release
        if: steps.release.outputs.state == 'draft'
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Verify immutable release and assets
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$GITHUB_REF_NAME"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done
          gh release verify-asset "$GITHUB_REF_NAME" dist/release/*.whl
          gh release verify-asset "$GITHUB_REF_NAME" dist/release/*.tar.gz
          gh release verify-asset "$GITHUB_REF_NAME" dist/SHA256SUMS
