[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "modal-computer-use"
version = "1.0.0"
description = "Daemon-first Modal-native computer-use primitives for Linux desktops"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "modal-computer-use contributors" }]
dependencies = [
  "fastapi>=0.115",
  "h2>=4.1",
  "httpx[http2]>=0.27",
  "hypercorn>=0.17",
  "mss>=10.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
  "websockets>=13.0",
  "pillow>=10.0",
  "xxhash>=3.6",
]

[project.optional-dependencies]
modal = ["modal~=1.5.2"]
openai = ["openai>=2.36"]
anthropic = ["anthropic>=0.101"]
bench-daytona = ["daytona==0.175.0"]
bench-e2b = ["e2b-desktop==2.3.1"]
bench-providers = ["daytona==0.175.0", "e2b-desktop==2.3.1"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-Pillow",
]

[project.scripts]
computer-use = "modal_computer_use.cli:main"
computer-use-daemon = "modal_computer_use.daemon.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modal_computer_use"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["S106"]
"tests/*.py" = ["S106", "S108"]

[tool.mypy]
python_version = "3.12"
packages = ["modal_computer_use"]
strict = false
check_untyped_defs = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = false
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "no-any-return",
  "union-attr",
  "valid-type",
  "var-annotated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "modal: requires Modal credentials and network access",
]
