[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "modal-computer-use"
version = "2.0.0"
description = "Daemon-first Modal-native computer-use primitives for Linux desktops"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "modal-computer-use contributors" }]
dependencies = [
  "anyio>=4",
  "fastapi>=0.141.1",
  "h2>=4.1",
  "httpx[http2]>=0.27",
  "hypercorn>=0.17",
  "mss>=10.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
  "websockets>=13.0",
  "pillow>=12.3.0",
  "starlette>=1.0.1",
  "xxhash>=3.6",
]

[project.urls]
Homepage = "https://github.com/ashtonchew/modal-computer-use"
Documentation = "https://modal-computer-use.mintlify.app"
Repository = "https://github.com/ashtonchew/modal-computer-use"
Issues = "https://github.com/ashtonchew/modal-computer-use/issues"
Changelog = "https://github.com/ashtonchew/modal-computer-use/blob/main/CHANGELOG.md"

[project.optional-dependencies]
modal = ["modal~=1.5.3"]
openai = ["openai>=2.36"]
anthropic = ["anthropic>=0.101"]
bench-daytona = ["daytona==0.175.0"]
bench-e2b = ["e2b-desktop==2.4.2"]
bench-tzafon = ["tzafon==2.44.1"]
bench-providers = ["daytona==0.175.0", "e2b-desktop==2.4.2", "tzafon==2.44.1"]
dev = [
  "httpx2==2.7.0",
  "markdown-it-py==4.2.0",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.16",
]

[tool.uv]
required-version = "==0.12.3"

[project.scripts]
computer-use = "modal_computer_use.cli:main"
computer-use-daemon = "modal_computer_use.daemon.__main__:main"

[tool.hatch.build.targets.sdist]
only-include = [
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "pyproject.toml",
  "src/modal_computer_use",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modal_computer_use"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["S106"]
"tests/*.py" = ["S106", "S108"]

[tool.mypy]
python_version = "3.12"
packages = ["modal_computer_use"]
strict = false
check_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "no-any-return",
  "union-attr",
  "valid-type",
]

[[tool.mypy.overrides]]
module = ["modal", "modal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "modal: requires Modal credentials and network access",
]
