<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Modal screenshot request path before and after optimization</title>
  <desc id="desc">Two aligned paths compare an external benchmark routed through an attested tunnel with a Modal Function in us-west-2 routed through Modal Connect. Both reach the same warm daemon and capture pipeline.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .result { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .row, .row-opt, .label, .small, .metric, .arrow-label, .arrow-label-opt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-opt { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .metric { fill: #F1F4EF; font-size: 20px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .arrow-label-opt { fill: #AACCB0; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #8A948B; stroke-width: 1.5; }
      .path-opt { fill: none; stroke: #91B89A; stroke-width: 1.8; }
    </style>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>

  <rect class="bg" width="960" height="320"/>

  <text class="row" x="32" y="32">Modal default</text>
  <rect class="box" x="32" y="48" width="140" height="88" rx="8"/>
  <text class="label" x="102" y="77" text-anchor="middle">External</text>
  <text class="label" x="102" y="98" text-anchor="middle">benchmark</text>
  <text class="small" x="102" y="122" text-anchor="middle">Outside Modal</text>
  <rect class="box" x="221" y="48" width="140" height="88" rx="8"/>
  <text class="label" x="291" y="87" text-anchor="middle">Attested tunnel</text>
  <rect class="box" x="410" y="48" width="140" height="88" rx="8"/>
  <text class="label" x="480" y="87" text-anchor="middle">Warm daemon</text>
  <rect class="box" x="599" y="48" width="140" height="88" rx="8"/>
  <text class="label" x="669" y="80" text-anchor="middle">Capture and</text>
  <text class="label" x="669" y="101" text-anchor="middle">encode</text>
  <rect class="box" x="788" y="48" width="140" height="88" rx="8"/>
  <text class="metric" x="858" y="84" text-anchor="middle">230 ms p50</text>
  <text class="small" x="858" y="112" text-anchor="middle">1024×768 PNG</text>

  <line class="path" x1="172" y1="92" x2="221" y2="92" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="196.5" y="76" text-anchor="middle">Request</text>
  <line class="path" x1="361" y1="92" x2="410" y2="92" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="385.5" y="76" text-anchor="middle">Route</text>
  <line class="path" x1="550" y1="92" x2="599" y2="92" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="574.5" y="76" text-anchor="middle">Capture</text>
  <line class="path" x1="739" y1="92" x2="788" y2="92" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="763.5" y="76" text-anchor="middle">Return</text>

  <text class="row-opt" x="32" y="184">Modal optimized</text>
  <rect class="changed" x="32" y="200" width="140" height="88" rx="8"/>
  <text class="label" x="102" y="232" text-anchor="middle">Modal Function</text>
  <text class="small" x="102" y="260" text-anchor="middle">us-west-2</text>
  <rect class="changed" x="221" y="200" width="140" height="88" rx="8"/>
  <text class="label" x="291" y="239" text-anchor="middle">Modal Connect</text>
  <rect class="box" x="410" y="200" width="140" height="88" rx="8"/>
  <text class="label" x="480" y="239" text-anchor="middle">Warm daemon</text>
  <rect class="box" x="599" y="200" width="140" height="88" rx="8"/>
  <text class="label" x="669" y="232" text-anchor="middle">Capture and</text>
  <text class="label" x="669" y="253" text-anchor="middle">encode</text>
  <rect class="result" x="788" y="200" width="140" height="88" rx="8"/>
  <text class="metric" x="858" y="236" text-anchor="middle">29 ms p50</text>
  <text class="small" x="858" y="264" text-anchor="middle">1024×768 PNG</text>

  <line class="path-opt" x1="172" y1="244" x2="221" y2="244" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="196.5" y="228" text-anchor="middle">Request</text>
  <line class="path-opt" x1="361" y1="244" x2="410" y2="244" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="385.5" y="228" text-anchor="middle">Route</text>
  <line class="path-opt" x1="550" y1="244" x2="599" y2="244" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="574.5" y="228" text-anchor="middle">Capture</text>
  <line class="path-opt" x1="739" y1="244" x2="788" y2="244" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="763.5" y="228" text-anchor="middle">Return</text>
</svg>
