<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Modal screenshot path before and after optimization</title>
  <desc id="desc">Two aligned request paths show an external benchmark client using an attested tunnel before optimization and a Modal Function client using Connect after optimization.</desc>
  <defs>
    <style>
      .bg { fill: #FAF8F2; }
      .box { fill: #F0EEE8; stroke: #A9AAA6; stroke-width: 1.25; }
      .result-before { fill: #F0EEE8; stroke: #A9AAA6; stroke-width: 1.25; }
      .result-after { fill: #E9F0E7; stroke: #66856B; stroke-width: 1.4; }
      .row,
      .row-after,
      .row-note,
      .label,
      .small,
      .metric,
      .arrow-label,
      .arrow-label-after {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .row { fill: #292C2F; font-size: 17px; font-weight: 700; }
      .row-after { fill: #52705A; font-size: 17px; font-weight: 700; }
      .row-note { fill: #686D6A; font-size: 14px; font-weight: 500; }
      .label { fill: #292C2F; font-size: 15px; font-weight: 600; }
      .small { fill: #626865; font-size: 12px; }
      .metric { fill: #292C2F; font-size: 20px; font-weight: 700; }
      .arrow-label { fill: #626865; font-size: 13px; font-weight: 500; }
      .arrow-label-after { fill: #52705A; font-size: 13px; font-weight: 500; }
      .path-before { stroke: #9A9D99; stroke-width: 1.5; }
      .path-after { stroke: #66856B; stroke-width: 1.8; }
      .arrow-before { fill: #9A9D99; }
      .arrow-after { fill: #66856B; }
    </style>
  </defs>

  <rect class="bg" width="860" height="360"/>

  <text class="row" x="24" y="32">Modal default</text>
  <text class="row-note" x="140" y="32">(before)</text>

  <rect class="box" x="24" y="48" width="112" height="104" rx="8"/>
  <text class="label" x="80" y="86" text-anchor="middle">External client</text>
  <text class="small" x="80" y="112" text-anchor="middle">Benchmark process</text>
  <text class="small" x="80" y="128" text-anchor="middle">outside Modal</text>

  <rect class="box" x="200" y="60" width="104" height="80" rx="8"/>
  <text class="label" x="252" y="96" text-anchor="middle">Attested</text>
  <text class="label" x="252" y="116" text-anchor="middle">tunnel</text>

  <rect class="box" x="368" y="60" width="96" height="80" rx="8"/>
  <text class="label" x="416" y="96" text-anchor="middle">Warm</text>
  <text class="label" x="416" y="116" text-anchor="middle">daemon</text>

  <rect class="box" x="528" y="60" width="112" height="80" rx="8"/>
  <text class="label" x="584" y="96" text-anchor="middle">Capture +</text>
  <text class="label" x="584" y="116" text-anchor="middle">encode</text>

  <rect class="result-before" x="704" y="48" width="132" height="104" rx="8"/>
  <text class="small" x="770" y="76" text-anchor="middle">1024×768 PNG</text>
  <text class="metric" x="770" y="108" text-anchor="middle">126.86 ms</text>
  <text class="small" x="770" y="132" text-anchor="middle">median · n=3</text>

  <line class="path-before" x1="136" y1="100" x2="200" y2="100"/>
  <path class="arrow-before" d="M 192 95 L 200 100 L 192 105 Z"/>
  <text class="arrow-label" x="168" y="86" text-anchor="middle">Request</text>

  <line class="path-before" x1="304" y1="100" x2="368" y2="100"/>
  <path class="arrow-before" d="M 360 95 L 368 100 L 360 105 Z"/>
  <text class="arrow-label" x="336" y="86" text-anchor="middle">Route</text>

  <line class="path-before" x1="464" y1="100" x2="528" y2="100"/>
  <path class="arrow-before" d="M 520 95 L 528 100 L 520 105 Z"/>
  <text class="arrow-label" x="496" y="86" text-anchor="middle">Capture</text>

  <line class="path-before" x1="640" y1="100" x2="704" y2="100"/>
  <path class="arrow-before" d="M 696 95 L 704 100 L 696 105 Z"/>
  <text class="arrow-label" x="672" y="86" text-anchor="middle">Return</text>

  <text class="row-after" x="24" y="204">Modal optimized</text>
  <text class="row-note" x="164" y="204">(after)</text>

  <rect class="box" x="24" y="220" width="112" height="104" rx="8"/>
  <text class="label" x="80" y="250" text-anchor="middle">Modal Function</text>
  <text class="label" x="80" y="270" text-anchor="middle">client</text>
  <text class="small" x="80" y="296" text-anchor="middle">Region requested</text>
  <text class="small" x="80" y="312" text-anchor="middle">to match target</text>

  <rect class="box" x="200" y="232" width="104" height="80" rx="8"/>
  <text class="label" x="252" y="278" text-anchor="middle">Connect</text>

  <rect class="box" x="368" y="232" width="96" height="80" rx="8"/>
  <text class="label" x="416" y="268" text-anchor="middle">Warm</text>
  <text class="label" x="416" y="288" text-anchor="middle">daemon</text>

  <rect class="box" x="528" y="232" width="112" height="80" rx="8"/>
  <text class="label" x="584" y="268" text-anchor="middle">Capture +</text>
  <text class="label" x="584" y="288" text-anchor="middle">encode</text>

  <rect class="result-after" x="704" y="220" width="132" height="104" rx="8"/>
  <text class="small" x="770" y="248" text-anchor="middle">1024×768 PNG</text>
  <text class="metric" x="770" y="280" text-anchor="middle">32.42 ms</text>
  <text class="small" x="770" y="304" text-anchor="middle">median · n=30</text>

  <line class="path-after" x1="136" y1="272" x2="200" y2="272"/>
  <path class="arrow-after" d="M 192 267 L 200 272 L 192 277 Z"/>
  <text class="arrow-label-after" x="168" y="258" text-anchor="middle">Request</text>

  <line class="path-after" x1="304" y1="272" x2="368" y2="272"/>
  <path class="arrow-after" d="M 360 267 L 368 272 L 360 277 Z"/>
  <text class="arrow-label-after" x="336" y="258" text-anchor="middle">Route</text>

  <line class="path-after" x1="464" y1="272" x2="528" y2="272"/>
  <path class="arrow-after" d="M 520 267 L 528 272 L 520 277 Z"/>
  <text class="arrow-label-after" x="496" y="258" text-anchor="middle">Capture</text>

  <line class="path-after" x1="640" y1="272" x2="704" y2="272"/>
  <path class="arrow-after" d="M 696 267 L 704 272 L 696 277 Z"/>
  <text class="arrow-label-after" x="672" y="258" text-anchor="middle">Return</text>
</svg>
