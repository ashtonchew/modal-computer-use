<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="384" viewBox="0 0 1152 384" role="img" aria-labelledby="title desc">
  <title id="title">Modal screenshot request path before and after optimization</title>
  <desc id="desc">Two aligned paths compare an external benchmark routed through an attested tunnel with a Modal Function in us-west-2 routed through Modal Connect. Both reach the same warm daemon and capture pipeline.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .result { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .row, .row-opt, .label, .small, .metric, .arrow-label, .arrow-label-opt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-opt { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .metric { fill: #F1F4EF; font-size: 20px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .arrow-label-opt { fill: #AACCB0; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #8A948B; stroke-width: 1.5; }
      .path-opt { fill: none; stroke: #91B89A; stroke-width: 1.8; }
    </style>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>
  <rect class="bg" width="1152" height="384"/>

  <text class="row" x="32" y="36">Modal default</text>
  <rect class="box" x="32" y="64" width="144" height="104" rx="8"/>
  <text class="label" x="104" y="94" text-anchor="middle">External</text>
  <text class="label" x="104" y="115" text-anchor="middle">benchmark</text>
  <text class="small" x="104" y="143" text-anchor="middle">Outside Modal</text>
  <rect class="box" x="268" y="64" width="144" height="104" rx="8"/>
  <text class="label" x="340" y="109" text-anchor="middle">Attested</text>
  <text class="label" x="340" y="130" text-anchor="middle">tunnel</text>
  <rect class="box" x="504" y="64" width="144" height="104" rx="8"/>
  <text class="label" x="576" y="121" text-anchor="middle">Warm daemon</text>
  <rect class="box" x="740" y="64" width="144" height="104" rx="8"/>
  <text class="label" x="812" y="109" text-anchor="middle">Capture and</text>
  <text class="label" x="812" y="130" text-anchor="middle">encode</text>
  <rect class="box" x="976" y="64" width="144" height="104" rx="8"/>
  <text class="metric" x="1048" y="100" text-anchor="middle">230 ms</text>
  <text class="small" x="1048" y="126" text-anchor="middle">p50</text>
  <text class="small" x="1048" y="148" text-anchor="middle">1024×768 PNG</text>
  <line class="path" x1="176" y1="116" x2="268" y2="116" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="222" y="94" text-anchor="middle">Request</text>
  <line class="path" x1="412" y1="116" x2="504" y2="116" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="458" y="94" text-anchor="middle">Route</text>
  <line class="path" x1="648" y1="116" x2="740" y2="116" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="694" y="94" text-anchor="middle">Capture</text>
  <line class="path" x1="884" y1="116" x2="976" y2="116" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="930" y="94" text-anchor="middle">Return</text>

  <text class="row-opt" x="32" y="220">Modal optimized</text>
  <rect class="changed" x="32" y="248" width="144" height="104" rx="8"/>
  <text class="label" x="104" y="278" text-anchor="middle">Modal</text>
  <text class="label" x="104" y="299" text-anchor="middle">Function</text>
  <text class="small" x="104" y="327" text-anchor="middle">us-west-2</text>
  <rect class="changed" x="268" y="248" width="144" height="104" rx="8"/>
  <text class="label" x="340" y="293" text-anchor="middle">Modal</text>
  <text class="label" x="340" y="314" text-anchor="middle">Connect</text>
  <rect class="box" x="504" y="248" width="144" height="104" rx="8"/>
  <text class="label" x="576" y="305" text-anchor="middle">Warm daemon</text>
  <rect class="box" x="740" y="248" width="144" height="104" rx="8"/>
  <text class="label" x="812" y="293" text-anchor="middle">Capture and</text>
  <text class="label" x="812" y="314" text-anchor="middle">encode</text>
  <rect class="result" x="976" y="248" width="144" height="104" rx="8"/>
  <text class="metric" x="1048" y="284" text-anchor="middle">29 ms</text>
  <text class="small" x="1048" y="310" text-anchor="middle">p50</text>
  <text class="small" x="1048" y="332" text-anchor="middle">1024×768 PNG</text>
  <line class="path-opt" x1="176" y1="300" x2="268" y2="300" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="222" y="278" text-anchor="middle">Request</text>
  <line class="path-opt" x1="412" y1="300" x2="504" y2="300" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="458" y="278" text-anchor="middle">Route</text>
  <line class="path-opt" x1="648" y1="300" x2="740" y2="300" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="694" y="278" text-anchor="middle">Capture</text>
  <line class="path-opt" x1="884" y1="300" x2="976" y2="300" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="930" y="278" text-anchor="middle">Return</text>
</svg>
