<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Modal screenshot path before and after optimization</title>
  <desc id="desc">Two aligned request paths compare an external client using an attested tunnel with a Modal Function client using Connect and a region configured to match the target.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.25; }
      .result-before { fill: #1C231D; stroke: #657066; stroke-width: 1.25; }
      .result-after { fill: #233528; stroke: #91B89A; stroke-width: 1.4; }
      .row,
      .row-after,
      .row-note,
      .label,
      .small,
      .metric,
      .arrow-label,
      .arrow-label-after {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-after { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .row-note { fill: #B9C2B8; font-size: 14px; font-weight: 500; }
      .label { fill: #F1F4EF; font-size: 15px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .metric { fill: #F1F4EF; font-size: 22px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 13px; font-weight: 500; }
      .arrow-label-after { fill: #AACCB0; font-size: 13px; font-weight: 500; }
      .path-before { stroke: #8A948B; stroke-width: 1.5; }
      .path-after { stroke: #91B89A; stroke-width: 1.8; }
      .arrow-before { fill: #8A948B; }
      .arrow-after { fill: #91B89A; }
    </style>
  </defs>

  <rect class="bg" width="960" height="400"/>

  <text class="row" x="32" y="32">Modal default</text>
  <text class="row-note" x="148" y="32">(before)</text>

  <rect class="box" x="24" y="56" width="152" height="96" rx="8"/>
  <text class="label" x="100" y="91" text-anchor="middle">External client</text>
  <text class="small" x="100" y="117" text-anchor="middle">Benchmark process</text>
  <text class="small" x="100" y="134" text-anchor="middle">outside Modal</text>

  <rect class="box" x="240" y="56" width="112" height="96" rx="8"/>
  <text class="label" x="296" y="99" text-anchor="middle">Attested</text>
  <text class="label" x="296" y="120" text-anchor="middle">tunnel</text>

  <rect class="box" x="416" y="56" width="112" height="96" rx="8"/>
  <text class="label" x="472" y="99" text-anchor="middle">Warm</text>
  <text class="label" x="472" y="120" text-anchor="middle">daemon</text>

  <rect class="box" x="592" y="56" width="128" height="96" rx="8"/>
  <text class="label" x="656" y="99" text-anchor="middle">Capture +</text>
  <text class="label" x="656" y="120" text-anchor="middle">encode</text>

  <rect class="result-before" x="784" y="56" width="152" height="96" rx="8"/>
  <text class="metric" x="860" y="99" text-anchor="middle">229.94 ms</text>
  <text class="small" x="860" y="128" text-anchor="middle">1024×768 PNG</text>

  <line class="path-before" x1="176" y1="104" x2="240" y2="104"/>
  <path class="arrow-before" d="M 232 99 L 240 104 L 232 109 Z"/>
  <text class="arrow-label" x="208" y="88" text-anchor="middle">Send</text>

  <line class="path-before" x1="352" y1="104" x2="416" y2="104"/>
  <path class="arrow-before" d="M 408 99 L 416 104 L 408 109 Z"/>
  <text class="arrow-label" x="384" y="88" text-anchor="middle">Forward</text>

  <line class="path-before" x1="528" y1="104" x2="592" y2="104"/>
  <path class="arrow-before" d="M 584 99 L 592 104 L 584 109 Z"/>
  <text class="arrow-label" x="560" y="88" text-anchor="middle">Capture</text>

  <line class="path-before" x1="720" y1="104" x2="784" y2="104"/>
  <path class="arrow-before" d="M 776 99 L 784 104 L 776 109 Z"/>
  <text class="arrow-label" x="752" y="88" text-anchor="middle">Return</text>

  <text class="row-after" x="32" y="220">Modal optimized</text>
  <text class="row-note" x="172" y="220">(after)</text>

  <rect class="box" x="24" y="244" width="152" height="96" rx="8"/>
  <text class="label" x="100" y="279" text-anchor="middle">Modal Function</text>
  <text class="label" x="100" y="300" text-anchor="middle">client</text>
  <text class="small" x="100" y="326" text-anchor="middle">Target region selected</text>

  <rect class="box" x="240" y="244" width="112" height="96" rx="8"/>
  <text class="label" x="296" y="298" text-anchor="middle">Connect</text>

  <rect class="box" x="416" y="244" width="112" height="96" rx="8"/>
  <text class="label" x="472" y="287" text-anchor="middle">Warm</text>
  <text class="label" x="472" y="308" text-anchor="middle">daemon</text>

  <rect class="box" x="592" y="244" width="128" height="96" rx="8"/>
  <text class="label" x="656" y="287" text-anchor="middle">Capture +</text>
  <text class="label" x="656" y="308" text-anchor="middle">encode</text>

  <rect class="result-after" x="784" y="244" width="152" height="96" rx="8"/>
  <text class="metric" x="860" y="287" text-anchor="middle">28.69 ms</text>
  <text class="small" x="860" y="316" text-anchor="middle">1024×768 PNG</text>

  <line class="path-after" x1="176" y1="292" x2="240" y2="292"/>
  <path class="arrow-after" d="M 232 287 L 240 292 L 232 297 Z"/>
  <text class="arrow-label-after" x="208" y="276" text-anchor="middle">Send</text>

  <line class="path-after" x1="352" y1="292" x2="416" y2="292"/>
  <path class="arrow-after" d="M 408 287 L 416 292 L 408 297 Z"/>
  <text class="arrow-label-after" x="384" y="276" text-anchor="middle">Forward</text>

  <line class="path-after" x1="528" y1="292" x2="592" y2="292"/>
  <path class="arrow-after" d="M 584 287 L 592 292 L 584 297 Z"/>
  <text class="arrow-label-after" x="560" y="276" text-anchor="middle">Capture</text>

  <line class="path-after" x1="720" y1="292" x2="784" y2="292"/>
  <path class="arrow-after" d="M 776 287 L 784 292 L 776 297 Z"/>
  <text class="arrow-label-after" x="752" y="276" text-anchor="middle">Return</text>
</svg>
