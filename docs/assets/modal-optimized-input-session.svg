<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="432" viewBox="0 0 1152 432" role="img" aria-labelledby="title desc">
  <title id="title">Per-action X11 setup compared with a persistent Xlib session</title>
  <desc id="desc">The default compatibility path starts xdotool and opens an X11 connection for each API action. The optimized path builds input events and reuses one Xlib session, locking once, queueing XTest events, and synchronizing once.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .primary { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .step-group { fill: none; stroke: #91B89A; stroke-width: 1.1; stroke-dasharray: 1 4; stroke-linecap: round; }
      .row, .row-opt, .label, .small, .step, .metric, .arrow-label, .arrow-label-opt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-opt { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .step { fill: #F1F4EF; font-size: 12px; font-weight: 500; }
      .metric { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .arrow-label-opt { fill: #AACCB0; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #8A948B; stroke-width: 1.5; }
      .path-opt { fill: none; stroke: #91B89A; stroke-width: 1.8; }
      .path-step { fill: none; stroke: #91B89A; stroke-width: 1.3; }
    </style>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>
  <rect class="bg" width="1152" height="432"/>

  <text class="row" x="32" y="40">Per-action setup</text>
  <rect class="box" x="32" y="68" width="128" height="120" rx="8"/>
  <text class="label" x="96" y="133" text-anchor="middle">API action</text>
  <rect class="box" x="268" y="68" width="128" height="120" rx="8"/>
  <text class="label" x="332" y="121" text-anchor="middle">Start</text>
  <text class="label" x="332" y="142" text-anchor="middle">xdotool</text>
  <rect class="box" x="504" y="68" width="128" height="120" rx="8"/>
  <text class="label" x="568" y="121" text-anchor="middle">Open X11</text>
  <text class="label" x="568" y="142" text-anchor="middle">connection</text>
  <rect class="box" x="740" y="68" width="128" height="120" rx="8"/>
  <text class="label" x="804" y="133" text-anchor="middle">X11 server</text>
  <rect class="box" x="976" y="68" width="128" height="120" rx="8"/>
  <text class="metric" x="1040" y="122" text-anchor="middle">146 ms</text>
  <text class="small" x="1040" y="152" text-anchor="middle">Move + click</text>
  <line class="path" x1="160" y1="128" x2="268" y2="128" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="214" y="106" text-anchor="middle">Launch</text>
  <line class="path" x1="396" y1="128" x2="504" y2="128" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="450" y="106" text-anchor="middle">Open</text>
  <line class="path" x1="632" y1="128" x2="740" y2="128" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="686" y="106" text-anchor="middle">Send input</text>
  <line class="path" x1="868" y1="128" x2="976" y2="128" marker-end="url(#arrow-neutral)"/>

  <text class="row-opt" x="32" y="256">Persistent input session</text>
  <rect class="box" x="32" y="284" width="128" height="120" rx="8"/>
  <text class="label" x="96" y="349" text-anchor="middle">API action</text>
  <rect class="changed" x="268" y="284" width="128" height="120" rx="8"/>
  <text class="label" x="332" y="337" text-anchor="middle">Build input</text>
  <text class="label" x="332" y="358" text-anchor="middle">events</text>
  <rect class="primary" x="484" y="284" width="168" height="120" rx="8"/>
  <text class="label" x="568" y="310" text-anchor="middle">One input lock</text>
  <rect class="step-group" x="500" y="322" width="136" height="68" rx="5"/>
  <text class="step" x="568" y="341" text-anchor="middle">Queue XTest events</text>
  <line class="path-step" x1="568" y1="349" x2="568" y2="363" marker-end="url(#arrow-sage)"/>
  <text class="step" x="568" y="382" text-anchor="middle">XSync once</text>
  <rect class="box" x="740" y="284" width="128" height="120" rx="8"/>
  <text class="label" x="804" y="349" text-anchor="middle">X11 server</text>
  <rect class="primary" x="976" y="284" width="128" height="120" rx="8"/>
  <text class="metric" x="1040" y="338" text-anchor="middle">1.2 ms</text>
  <text class="small" x="1040" y="368" text-anchor="middle">Move + click</text>
  <line class="path-opt" x1="160" y1="344" x2="268" y2="344" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="214" y="322" text-anchor="middle">Prepare</text>
  <line class="path-opt" x1="396" y1="344" x2="484" y2="344" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="440" y="322" text-anchor="middle">Reuse session</text>
  <line class="path-opt" x1="652" y1="344" x2="740" y2="344" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="696" y="322" text-anchor="middle">Send XTest</text>
  <line class="path-opt" x1="868" y1="344" x2="976" y2="344" marker-end="url(#arrow-sage)"/>
</svg>
