<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="376" viewBox="0 0 960 376" role="img" aria-labelledby="title desc">
  <title id="title">Per-action xdotool setup versus one persistent X11 input connection</title>
  <desc id="desc">The compatibility path launches an xdotool subprocess and opens a new connection to the X11 server for every action. The native path builds ordered events, enters a client-side session lock, queues XTest events through one persistent Xlib connection shared by mouse and keyboard, and synchronizes once for each nonempty emission to the same X11 server.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.25; }
      .native { fill: #233528; stroke: #91B89A; stroke-width: 1.4; }
      .step { fill: #101411; stroke: #91B89A; stroke-width: 1.15; }
      .row,
      .row-native,
      .row-note,
      .label,
      .small,
      .arrow-label,
      .arrow-label-native {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-native { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .row-note { fill: #B9C2B8; font-size: 14px; font-weight: 500; }
      .label { fill: #F1F4EF; font-size: 15px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .arrow-label-native { fill: #AACCB0; font-size: 13px; font-weight: 500; }
      .path { stroke: #8A948B; stroke-width: 1.5; }
      .path-native { stroke: #91B89A; stroke-width: 1.8; }
      .arrow { fill: #8A948B; }
      .arrow-native { fill: #91B89A; }
    </style>
  </defs>

  <rect class="bg" width="960" height="376"/>

  <text class="row" x="32" y="32">Compatibility path</text>
  <text class="row-note" x="188" y="32">(repeats setup)</text>

  <rect class="box" x="32" y="64" width="132" height="80" rx="8"/>
  <text class="label" x="98" y="109" text-anchor="middle">API action</text>

  <rect class="box" x="212" y="64" width="288" height="80" rx="8"/>
  <text class="label" x="356" y="96" text-anchor="middle">xdotool subprocess</text>
  <text class="small" x="356" y="121" text-anchor="middle">start · open X11 · emit · exit</text>

  <line class="path" x1="164" y1="104" x2="212" y2="104"/>
  <path class="arrow" d="M 204 99 L 212 104 L 204 109 Z"/>
  <text class="arrow-label" x="188" y="88" text-anchor="middle">launch</text>

  <line class="path" x1="500" y1="104" x2="800" y2="104"/>
  <path class="arrow" d="M 792 99 L 800 104 L 792 109 Z"/>
  <text class="arrow-label" x="650" y="88" text-anchor="middle">new connection every action</text>

  <text class="row-native" x="32" y="190">Native path</text>
  <text class="row-note" x="132" y="190">(one daemon session)</text>

  <rect class="box" x="32" y="216" width="144" height="128" rx="8"/>
  <text class="label" x="104" y="263" text-anchor="middle">Repeated API</text>
  <text class="label" x="104" y="284" text-anchor="middle">actions</text>
  <text class="small" x="104" y="313" text-anchor="middle">click · type · scroll</text>

  <rect class="box" x="224" y="216" width="144" height="128" rx="8"/>
  <text class="label" x="296" y="263" text-anchor="middle">Build ordered</text>
  <text class="label" x="296" y="284" text-anchor="middle">events</text>
  <text class="small" x="296" y="313" text-anchor="middle">move → press → release</text>

  <rect class="native" x="416" y="216" width="320" height="128" rx="8"/>
  <text class="label" x="576" y="244" text-anchor="middle">Persistent Xlib connection</text>
  <text class="small" x="576" y="264" text-anchor="middle">reused by mouse + keyboard</text>

  <rect class="step" x="436" y="280" width="84" height="44" rx="8"/>
  <text class="small" x="478" y="299" text-anchor="middle">Session</text>
  <text class="small" x="478" y="315" text-anchor="middle">lock</text>

  <rect class="step" x="548" y="280" width="92" height="44" rx="8"/>
  <text class="small" x="594" y="299" text-anchor="middle">Queue XTest</text>
  <text class="small" x="594" y="315" text-anchor="middle">events</text>

  <rect class="step" x="668" y="280" width="56" height="44" rx="8"/>
  <text class="small" x="696" y="299" text-anchor="middle">XSync</text>
  <text class="small" x="696" y="315" text-anchor="middle">once</text>

  <line class="path-native" x1="176" y1="280" x2="224" y2="280"/>
  <path class="arrow-native" d="M 216 275 L 224 280 L 216 285 Z"/>

  <line class="path-native" x1="368" y1="280" x2="416" y2="280"/>
  <path class="arrow-native" d="M 408 275 L 416 280 L 408 285 Z"/>

  <line class="path-native" x1="520" y1="302" x2="548" y2="302"/>
  <path class="arrow-native" d="M 540 297 L 548 302 L 540 307 Z"/>

  <line class="path-native" x1="640" y1="302" x2="668" y2="302"/>
  <path class="arrow-native" d="M 660 297 L 668 302 L 660 307 Z"/>

  <line class="path-native" x1="736" y1="280" x2="800" y2="280"/>
  <path class="arrow-native" d="M 792 275 L 800 280 L 792 285 Z"/>
  <text class="arrow-label-native" x="768" y="264" text-anchor="middle">Reuse</text>

  <rect class="box" x="800" y="64" width="128" height="280" rx="8"/>
  <text class="label" x="864" y="191" text-anchor="middle">X11 server</text>
  <text class="small" x="864" y="216" text-anchor="middle">owns desktop input</text>

</svg>
