<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" aria-labelledby="title desc">
  <title id="title">Per-action X11 setup compared with a persistent Xlib session</title>
  <desc id="desc">The default compatibility path starts xdotool and opens an X11 connection for each API action. The optimized path builds input events and reuses one Xlib session, locking once, queueing XTest events, and synchronizing once.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .primary { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .row, .row-opt, .label, .small, .metric, .arrow-label, .arrow-label-opt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-opt { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .metric { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .arrow-label-opt { fill: #AACCB0; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #8A948B; stroke-width: 1.5; }
      .path-opt { fill: none; stroke: #91B89A; stroke-width: 1.8; }
    </style>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>

  <rect class="bg" width="960" height="368"/>

  <text class="row" x="32" y="32">Per-action setup</text>
  <rect class="box" x="32" y="48" width="140" height="112" rx="8"/>
  <text class="label" x="102" y="110" text-anchor="middle">API action</text>
  <rect class="box" x="221" y="48" width="140" height="112" rx="8"/>
  <text class="label" x="291" y="110" text-anchor="middle">Start xdotool</text>
  <rect class="box" x="410" y="48" width="140" height="112" rx="8"/>
  <text class="label" x="480" y="98" text-anchor="middle">Open X11</text>
  <text class="label" x="480" y="119" text-anchor="middle">connection</text>
  <rect class="box" x="599" y="48" width="140" height="112" rx="8"/>
  <text class="label" x="669" y="110" text-anchor="middle">X11 server</text>
  <rect class="box" x="788" y="48" width="140" height="112" rx="8"/>
  <text class="metric" x="858" y="98" text-anchor="middle">146 ms</text>
  <text class="small" x="858" y="126" text-anchor="middle">Move + click</text>

  <line class="path" x1="172" y1="104" x2="221" y2="104" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="196.5" y="88" text-anchor="middle">Launch</text>
  <line class="path" x1="361" y1="104" x2="410" y2="104" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="385.5" y="88" text-anchor="middle">Open</text>
  <line class="path" x1="550" y1="104" x2="599" y2="104" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="574.5" y="88" text-anchor="middle">Send input</text>
  <line class="path" x1="739" y1="104" x2="788" y2="104" marker-end="url(#arrow-neutral)"/>

  <text class="row-opt" x="32" y="208">Persistent input session</text>
  <rect class="box" x="32" y="224" width="140" height="112" rx="8"/>
  <text class="label" x="102" y="286" text-anchor="middle">API action</text>
  <rect class="changed" x="221" y="224" width="140" height="112" rx="8"/>
  <text class="label" x="291" y="274" text-anchor="middle">Build input</text>
  <text class="label" x="291" y="295" text-anchor="middle">events</text>
  <rect class="primary" x="410" y="224" width="140" height="112" rx="8"/>
  <text class="label" x="480" y="250" text-anchor="middle">Reuse Xlib session</text>
  <text class="small" x="480" y="276" text-anchor="middle">Lock once</text>
  <text class="small" x="480" y="296" text-anchor="middle">Queue XTest events</text>
  <text class="small" x="480" y="316" text-anchor="middle">Sync once</text>
  <rect class="box" x="599" y="224" width="140" height="112" rx="8"/>
  <text class="label" x="669" y="286" text-anchor="middle">X11 server</text>
  <rect class="primary" x="788" y="224" width="140" height="112" rx="8"/>
  <text class="metric" x="858" y="274" text-anchor="middle">1.2 ms</text>
  <text class="small" x="858" y="302" text-anchor="middle">Move + click</text>

  <line class="path-opt" x1="172" y1="280" x2="221" y2="280" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="196.5" y="264" text-anchor="middle">Prepare</text>
  <line class="path-opt" x1="361" y1="280" x2="410" y2="280" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="385.5" y="264" text-anchor="middle">Reuse</text>
  <line class="path-opt" x1="550" y1="280" x2="599" y2="280" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="574.5" y="264" text-anchor="middle">Send XTest</text>
  <line class="path-opt" x1="739" y1="280" x2="788" y2="280" marker-end="url(#arrow-sage)"/>
</svg>
