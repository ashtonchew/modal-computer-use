<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">One request executes four ordered clicks under one input lock</title>
  <desc id="desc">The daemon validates a four-click request, acquires the input lock once, executes clicks one through four in order, and releases the lock. A runtime error stops execution before the next click while preserving completed clicks.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .result { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .enclosure { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .click { fill: #101411; stroke: #91B89A; stroke-width: 1.2; }
      .label, .small, .section, .metric, .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .section { fill: #AACCB0; font-size: 14px; font-weight: 600; }
      .metric { fill: #F1F4EF; font-size: 18px; font-weight: 700; }
      .arrow-label { fill: #AACCB0; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #91B89A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .path-neutral { fill: none; stroke: #8A948B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
  </defs>

  <rect class="bg" width="960" height="440"/>

  <rect class="box" x="32" y="96" width="112" height="88" rx="8"/>
  <text class="label" x="88" y="130" text-anchor="middle">One request</text>
  <text class="small" x="88" y="158" text-anchor="middle">4 ordered clicks</text>

  <rect class="changed" x="192" y="96" width="112" height="88" rx="8"/>
  <text class="label" x="248" y="130" text-anchor="middle">Validate batch</text>
  <text class="small" x="248" y="158" text-anchor="middle">Before input</text>

  <rect class="changed" x="352" y="96" width="128" height="88" rx="8"/>
  <text class="label" x="416" y="130" text-anchor="middle">Acquire input</text>
  <text class="label" x="416" y="151" text-anchor="middle">lock</text>

  <rect class="enclosure" x="528" y="72" width="240" height="136" rx="8"/>
  <text class="section" x="648" y="98" text-anchor="middle">Execute in order</text>
  <rect class="click" x="548" y="120" width="44" height="56" rx="6"/>
  <text class="small" x="570" y="143" text-anchor="middle">Click</text>
  <text class="label" x="570" y="163" text-anchor="middle">1</text>
  <rect class="click" x="600" y="120" width="44" height="56" rx="6"/>
  <text class="small" x="622" y="143" text-anchor="middle">Click</text>
  <text class="label" x="622" y="163" text-anchor="middle">2</text>
  <rect class="click" x="652" y="120" width="44" height="56" rx="6"/>
  <text class="small" x="674" y="143" text-anchor="middle">Click</text>
  <text class="label" x="674" y="163" text-anchor="middle">3</text>
  <rect class="click" x="704" y="120" width="44" height="56" rx="6"/>
  <text class="small" x="726" y="143" text-anchor="middle">Click</text>
  <text class="label" x="726" y="163" text-anchor="middle">4</text>
  <line class="path" x1="592" y1="148" x2="600" y2="148" marker-end="url(#arrow-sage)"/>
  <line class="path" x1="644" y1="148" x2="652" y2="148" marker-end="url(#arrow-sage)"/>
  <line class="path" x1="696" y1="148" x2="704" y2="148" marker-end="url(#arrow-sage)"/>

  <rect class="changed" x="816" y="96" width="112" height="88" rx="8"/>
  <text class="label" x="872" y="130" text-anchor="middle">Release input</text>
  <text class="label" x="872" y="151" text-anchor="middle">lock</text>

  <line class="path" x1="144" y1="140" x2="192" y2="140" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="168" y="124" text-anchor="middle">Validate</text>
  <line class="path" x1="304" y1="140" x2="352" y2="140" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="328" y="124" text-anchor="middle">Acquire</text>
  <line class="path" x1="480" y1="140" x2="528" y2="140" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="504" y="124" text-anchor="middle">Execute</text>
  <line class="path" x1="768" y1="140" x2="816" y2="140" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="792" y="124" text-anchor="middle">Release</text>

  <path class="path-neutral" d="M648 208 V256 H344 V280" marker-end="url(#arrow-neutral)"/>
  <rect class="box" x="272" y="280" width="144" height="72" rx="8"/>
  <text class="label" x="344" y="322" text-anchor="middle">Runtime error</text>
  <line class="path-neutral" x1="416" y1="316" x2="464" y2="316" marker-end="url(#arrow-neutral)"/>
  <rect class="box" x="464" y="268" width="304" height="96" rx="8"/>
  <text class="label" x="616" y="302" text-anchor="middle">Stop before next click</text>
  <text class="small" x="616" y="332" text-anchor="middle">Completed clicks remain</text>

  <path class="path" d="M872 184 V220" marker-end="url(#arrow-sage)"/>
  <rect class="result" x="816" y="220" width="112" height="88" rx="8"/>
  <text class="metric" x="872" y="256" text-anchor="middle">14 ms p50</text>
  <text class="small" x="872" y="284" text-anchor="middle">Four clicks</text>
</svg>
