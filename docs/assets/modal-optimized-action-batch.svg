<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="504" viewBox="0 0 1280 504" role="img" aria-labelledby="title desc">
  <title id="title">One request executes four ordered clicks under one input lock</title>
  <desc id="desc">The daemon validates a four-click request, acquires the input lock once, executes clicks one through four in order, and releases the lock. A runtime error stops execution before the next click while preserving completed clicks.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .result { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .enclosure { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .click { fill: #101411; stroke: #91B89A; stroke-width: 1.2; }
      .label, .small, .section, .metric, .arrow-label, .arrow-label-neutral { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .section { fill: #AACCB0; font-size: 14px; font-weight: 600; }
      .metric { fill: #F1F4EF; font-size: 18px; font-weight: 700; }
      .arrow-label, .arrow-label-neutral { font-size: 12px; font-weight: 500; }
      .arrow-label { fill: #AACCB0; }
      .arrow-label-neutral { fill: #B9C2B8; }
      .path { fill: none; stroke: #91B89A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .path-neutral { fill: none; stroke: #8A948B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
  </defs>
  <rect class="bg" width="1280" height="504"/>

  <rect class="box" x="32" y="96" width="136" height="112" rx="8"/>
  <text class="label" x="100" y="143" text-anchor="middle">One request</text>
  <text class="small" x="100" y="173" text-anchor="middle">4 ordered clicks</text>
  <rect class="changed" x="248" y="96" width="136" height="112" rx="8"/>
  <text class="label" x="316" y="132" text-anchor="middle">Validate</text>
  <text class="label" x="316" y="153" text-anchor="middle">batch</text>
  <text class="small" x="316" y="181" text-anchor="middle">Before input</text>
  <rect class="changed" x="464" y="96" width="136" height="112" rx="8"/>
  <text class="label" x="532" y="143" text-anchor="middle">Acquire input</text>
  <text class="label" x="532" y="164" text-anchor="middle">lock</text>

  <rect class="enclosure" x="680" y="72" width="344" height="160" rx="8"/>
  <text class="section" x="852" y="104" text-anchor="middle">Execute in order</text>
  <rect class="click" x="716" y="128" width="50" height="72" rx="6"/>
  <text class="small" x="741" y="157" text-anchor="middle">Click</text>
  <text class="label" x="741" y="181" text-anchor="middle">1</text>
  <rect class="click" x="790" y="128" width="50" height="72" rx="6"/>
  <text class="small" x="815" y="157" text-anchor="middle">Click</text>
  <text class="label" x="815" y="181" text-anchor="middle">2</text>
  <rect class="click" x="864" y="128" width="50" height="72" rx="6"/>
  <text class="small" x="889" y="157" text-anchor="middle">Click</text>
  <text class="label" x="889" y="181" text-anchor="middle">3</text>
  <rect class="click" x="938" y="128" width="50" height="72" rx="6"/>
  <text class="small" x="963" y="157" text-anchor="middle">Click</text>
  <text class="label" x="963" y="181" text-anchor="middle">4</text>
  <line class="path" x1="766" y1="164" x2="790" y2="164" marker-end="url(#arrow-sage)"/>
  <line class="path" x1="840" y1="164" x2="864" y2="164" marker-end="url(#arrow-sage)"/>
  <line class="path" x1="914" y1="164" x2="938" y2="164" marker-end="url(#arrow-sage)"/>

  <rect class="changed" x="1104" y="96" width="144" height="112" rx="8"/>
  <text class="label" x="1176" y="143" text-anchor="middle">Release input</text>
  <text class="label" x="1176" y="164" text-anchor="middle">lock</text>
  <line class="path" x1="168" y1="152" x2="248" y2="152" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="208" y="130" text-anchor="middle">Validate</text>
  <line class="path" x1="384" y1="152" x2="464" y2="152" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="424" y="130" text-anchor="middle">Acquire</text>
  <line class="path" x1="600" y1="152" x2="680" y2="152" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="640" y="130" text-anchor="middle">Execute</text>
  <line class="path" x1="1024" y1="152" x2="1104" y2="152" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="1064" y="130" text-anchor="middle">Release</text>

  <path class="path-neutral" d="M852 232 V296 H552 V328" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label-neutral" x="702" y="274" text-anchor="middle">On error</text>
  <rect class="box" x="464" y="328" width="176" height="96" rx="8"/>
  <text class="label" x="552" y="381" text-anchor="middle">Runtime error</text>
  <line class="path-neutral" x1="640" y1="376" x2="720" y2="376" marker-end="url(#arrow-neutral)"/>
  <rect class="box" x="720" y="328" width="304" height="96" rx="8"/>
  <text class="label" x="872" y="366" text-anchor="middle">Stop before next click</text>
  <text class="small" x="872" y="396" text-anchor="middle">Completed clicks remain</text>
  <path class="path" d="M1176 208 V304" marker-end="url(#arrow-sage)"/>
  <rect class="result" x="1104" y="304" width="144" height="104" rx="8"/>
  <text class="metric" x="1176" y="351" text-anchor="middle">14 ms p50</text>
  <text class="small" x="1176" y="381" text-anchor="middle">Four clicks</text>
</svg>
