<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="432" viewBox="0 0 1280 432" role="img" aria-labelledby="title desc">
  <title id="title">Command subprocess I/O before and after event-loop isolation</title>
  <desc id="desc">Before isolation, the Uvicorn request loop owns subprocess input and output, pipe reads, waiting, and cleanup. After isolation, bounded admission and a thread-safe bridge send work to a private SelectorEventLoop that owns subprocess input and output while the operating-system child remains separate.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .primary { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .row, .row-opt, .label, .small, .metric, .arrow-label, .arrow-label-opt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-opt { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .metric { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .arrow-label-opt { fill: #AACCB0; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #8A948B; stroke-width: 1.5; }
      .path-opt { fill: none; stroke: #91B89A; stroke-width: 1.8; }
    </style>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>
  <rect class="bg" width="1280" height="432"/>

  <text class="row" x="32" y="36">Shared request loop</text>
  <rect class="box" x="32" y="64" width="144" height="112" rx="8"/>
  <text class="label" x="104" y="115" text-anchor="middle">Command</text>
  <text class="label" x="104" y="136" text-anchor="middle">request</text>
  <rect class="box" x="240" y="64" width="592" height="112" rx="8"/>
  <text class="label" x="536" y="98" text-anchor="middle">Uvicorn request loop</text>
  <text class="small" x="536" y="126" text-anchor="middle">Subprocess I/O, pipe reads, wait, and cleanup</text>
  <rect class="box" x="896" y="64" width="144" height="112" rx="8"/>
  <text class="label" x="968" y="115" text-anchor="middle">OS child</text>
  <text class="label" x="968" y="136" text-anchor="middle">process</text>
  <rect class="box" x="1104" y="64" width="144" height="112" rx="8"/>
  <text class="metric" x="1176" y="112" text-anchor="middle">56 ms p50</text>
  <text class="small" x="1176" y="142" text-anchor="middle">249 ms p95</text>
  <line class="path" x1="176" y1="120" x2="240" y2="120" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="208" y="98" text-anchor="middle">Run</text>
  <line class="path" x1="832" y1="120" x2="896" y2="120" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="864" y="98" text-anchor="middle">Spawn</text>
  <line class="path" x1="1040" y1="120" x2="1104" y2="120" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="1072" y="98" text-anchor="middle">Return</text>

  <text class="row-opt" x="32" y="252">Isolated subprocess loop</text>
  <rect class="box" x="32" y="280" width="144" height="120" rx="8"/>
  <text class="label" x="104" y="335" text-anchor="middle">Command</text>
  <text class="label" x="104" y="356" text-anchor="middle">request</text>
  <rect class="changed" x="240" y="280" width="144" height="120" rx="8"/>
  <text class="label" x="312" y="325" text-anchor="middle">Uvicorn</text>
  <text class="label" x="312" y="346" text-anchor="middle">request loop</text>
  <text class="small" x="312" y="374" text-anchor="middle">Bounded admission</text>
  <rect class="changed" x="448" y="280" width="144" height="120" rx="8"/>
  <text class="label" x="520" y="335" text-anchor="middle">Thread-safe</text>
  <text class="label" x="520" y="356" text-anchor="middle">bridge</text>
  <rect class="primary" x="656" y="280" width="176" height="120" rx="8"/>
  <text class="label" x="744" y="315" text-anchor="middle">Private event loop</text>
  <text class="small" x="744" y="344" text-anchor="middle">SelectorEventLoop</text>
  <text class="small" x="744" y="370" text-anchor="middle">Owns subprocess I/O</text>
  <rect class="box" x="896" y="280" width="144" height="120" rx="8"/>
  <text class="label" x="968" y="335" text-anchor="middle">OS child</text>
  <text class="label" x="968" y="356" text-anchor="middle">process</text>
  <rect class="primary" x="1104" y="280" width="144" height="120" rx="8"/>
  <text class="metric" x="1176" y="332" text-anchor="middle">10 ms p50</text>
  <text class="small" x="1176" y="362" text-anchor="middle">11 ms p95</text>
  <line class="path-opt" x1="176" y1="340" x2="240" y2="340" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="208" y="318" text-anchor="middle">Submit</text>
  <line class="path-opt" x1="384" y1="340" x2="448" y2="340" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="416" y="318" text-anchor="middle">Bridge</text>
  <line class="path-opt" x1="592" y1="340" x2="656" y2="340" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="624" y="318" text-anchor="middle">Schedule</text>
  <line class="path-opt" x1="832" y1="340" x2="896" y2="340" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="864" y="318" text-anchor="middle">Spawn</text>
  <line class="path-opt" x1="1040" y1="340" x2="1104" y2="340" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="1072" y="318" text-anchor="middle">Return</text>
</svg>
