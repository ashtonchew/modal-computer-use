<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" role="img" aria-labelledby="title desc">
  <title id="title">Command subprocess I/O before and after event-loop isolation</title>
  <desc id="desc">Before isolation, the Uvicorn request loop owns subprocess input and output, pipe reads, waiting, and cleanup. After isolation, bounded admission and a thread-safe bridge send work to a private SelectorEventLoop that owns subprocess input and output while the operating-system child remains separate.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .changed { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .primary { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .row, .row-opt, .label, .small, .metric, .arrow-label, .arrow-label-opt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .row { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .row-opt { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .label { fill: #F1F4EF; font-size: 13px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 11px; }
      .metric { fill: #F1F4EF; font-size: 17px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 11px; font-weight: 500; }
      .arrow-label-opt { fill: #AACCB0; font-size: 11px; font-weight: 500; }
      .path { fill: none; stroke: #8A948B; stroke-width: 1.5; }
      .path-opt { fill: none; stroke: #91B89A; stroke-width: 1.8; }
    </style>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>

  <rect class="bg" width="960" height="384"/>

  <text class="row" x="32" y="32">Shared request loop</text>
  <rect class="box" x="32" y="48" width="112" height="120" rx="8"/>
  <text class="label" x="88" y="102" text-anchor="middle">Command</text>
  <text class="label" x="88" y="122" text-anchor="middle">request</text>
  <rect class="box" x="184" y="48" width="416" height="120" rx="8"/>
  <text class="label" x="392" y="74" text-anchor="middle">Uvicorn request loop</text>
  <text class="small" x="392" y="103" text-anchor="middle">Owns subprocess I/O</text>
  <text class="small" x="392" y="123" text-anchor="middle">Pipe reads</text>
  <text class="small" x="392" y="143" text-anchor="middle">Wait and cleanup</text>
  <rect class="box" x="640" y="48" width="112" height="120" rx="8"/>
  <text class="label" x="696" y="102" text-anchor="middle">OS child</text>
  <text class="label" x="696" y="122" text-anchor="middle">process</text>
  <rect class="box" x="792" y="48" width="136" height="120" rx="8"/>
  <text class="metric" x="860" y="94" text-anchor="middle">56 ms p50</text>
  <text class="small" x="860" y="126" text-anchor="middle">249 ms p95</text>

  <line class="path" x1="144" y1="108" x2="184" y2="108" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="164" y="92" text-anchor="middle">Run</text>
  <line class="path" x1="600" y1="108" x2="640" y2="108" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="620" y="92" text-anchor="middle">Spawn</text>
  <line class="path" x1="752" y1="108" x2="792" y2="108" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="772" y="92" text-anchor="middle">Return</text>

  <text class="row-opt" x="32" y="216">Isolated subprocess loop</text>
  <rect class="box" x="32" y="232" width="112" height="120" rx="8"/>
  <text class="label" x="88" y="286" text-anchor="middle">Command</text>
  <text class="label" x="88" y="306" text-anchor="middle">request</text>
  <rect class="changed" x="184" y="232" width="112" height="120" rx="8"/>
  <text class="label" x="240" y="266" text-anchor="middle">Uvicorn</text>
  <text class="label" x="240" y="286" text-anchor="middle">request loop</text>
  <text class="small" x="240" y="318" text-anchor="middle">Bounded admission</text>
  <rect class="changed" x="336" y="232" width="112" height="120" rx="8"/>
  <text class="label" x="392" y="286" text-anchor="middle">Thread-safe</text>
  <text class="label" x="392" y="306" text-anchor="middle">bridge</text>
  <rect class="primary" x="488" y="232" width="112" height="120" rx="8"/>
  <text class="label" x="544" y="256" text-anchor="middle">Private event</text>
  <text class="label" x="544" y="275" text-anchor="middle">loop</text>
  <text class="small" x="544" y="299" text-anchor="middle">SelectorEventLoop</text>
  <text class="small" x="544" y="323" text-anchor="middle">Owns subprocess I/O</text>
  <rect class="box" x="640" y="232" width="112" height="120" rx="8"/>
  <text class="label" x="696" y="286" text-anchor="middle">OS child</text>
  <text class="label" x="696" y="306" text-anchor="middle">process</text>
  <rect class="primary" x="792" y="232" width="136" height="120" rx="8"/>
  <text class="metric" x="860" y="278" text-anchor="middle">10 ms p50</text>
  <text class="small" x="860" y="310" text-anchor="middle">11 ms p95</text>

  <line class="path-opt" x1="144" y1="292" x2="184" y2="292" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="164" y="276" text-anchor="middle">Admit</text>
  <line class="path-opt" x1="296" y1="292" x2="336" y2="292" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="316" y="276" text-anchor="middle">Bridge</text>
  <line class="path-opt" x1="448" y1="292" x2="488" y2="292" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="468" y="276" text-anchor="middle">Schedule</text>
  <line class="path-opt" x1="600" y1="292" x2="640" y2="292" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="620" y="276" text-anchor="middle">Spawn</text>
  <line class="path-opt" x1="752" y1="292" x2="792" y2="292" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label-opt" x="772" y="276" text-anchor="middle">Return</text>
</svg>
