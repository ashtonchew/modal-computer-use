<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="384" viewBox="0 0 1152 384" role="img" aria-labelledby="title desc">
  <title id="title">One-time setup feeds the repeated computer-use loop</title>
  <desc id="desc">A one-time create and connect stage starts a repeated loop from the current screen to the model, an action request, the desktop, and back to the next screenshot.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.4; }
      .setup { fill: #233528; stroke: #91B89A; stroke-width: 1.4; }
      .label, .small, .group, .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .group { fill: #AACCB0; font-size: 14px; font-weight: 600; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #91B89A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
  </defs>
  <rect class="bg" width="1152" height="384"/>

  <rect class="setup" x="32" y="32" width="176" height="80" rx="8"/>
  <text class="label" x="120" y="57" text-anchor="middle">Create and</text>
  <text class="label" x="120" y="78" text-anchor="middle">connect</text>
  <text class="small" x="120" y="98" text-anchor="middle">One-time setup</text>
  <path class="path" d="M120 112 V176" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="140" y="144">Start session</text>

  <text class="group" x="336" y="148">Repeat each turn</text>
  <rect class="box" x="32" y="176" width="176" height="96" rx="8"/>
  <text class="label" x="120" y="229" text-anchor="middle">Current screen</text>
  <rect class="box" x="336" y="176" width="176" height="96" rx="8"/>
  <text class="label" x="424" y="229" text-anchor="middle">Model</text>
  <rect class="box" x="640" y="176" width="176" height="96" rx="8"/>
  <text class="label" x="728" y="229" text-anchor="middle">Action request</text>
  <rect class="box" x="944" y="176" width="176" height="96" rx="8"/>
  <text class="label" x="1032" y="229" text-anchor="middle">Desktop</text>

  <line class="path" x1="208" y1="224" x2="336" y2="224" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="272" y="202" text-anchor="middle">Send screenshot</text>
  <line class="path" x1="512" y1="224" x2="640" y2="224" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="576" y="202" text-anchor="middle">Choose action</text>
  <line class="path" x1="816" y1="224" x2="944" y2="224" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="880" y="202" text-anchor="middle">Execute action</text>
  <path class="path" d="M1032 272 V344 H120 V272" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="576" y="328" text-anchor="middle">Capture next screenshot</text>
</svg>
