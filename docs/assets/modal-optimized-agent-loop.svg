<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Session setup feeds the computer-use loop</title>
  <desc id="desc">Create and connect starts a loop from the current screen to the model, an action request, the desktop, and back to an updated screen.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.4; }
      .stage { fill: #233528; stroke: #91B89A; stroke-width: 1.4; }
      .label,
      .small,
      .arrow-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .label { fill: #F1F4EF; font-size: 16px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 13px; }
      .arrow-label { fill: #B9C2B8; font-size: 13px; font-weight: 500; }
      .path { stroke: #91B89A; stroke-width: 1.8; }
      .arrow { fill: #91B89A; }
    </style>
  </defs>

  <rect class="bg" width="960" height="360"/>

  <rect class="stage" x="40" y="24" width="208" height="72" rx="8"/>
  <text class="label" x="144" y="55" text-anchor="middle">Create + connect</text>
  <text class="small" x="144" y="78" text-anchor="middle">Session setup</text>

  <line class="path" x1="144" y1="96" x2="144" y2="152"/>
  <path class="arrow" d="M 139 152 L 144 160 L 149 152 Z"/>
  <text class="arrow-label" x="160" y="132">Start session</text>

  <rect class="box" x="72" y="160" width="144" height="88" rx="8"/>
  <text class="label" x="144" y="210" text-anchor="middle">Current screen</text>

  <rect class="box" x="320" y="160" width="128" height="88" rx="8"/>
  <text class="label" x="384" y="210" text-anchor="middle">Model</text>

  <rect class="box" x="552" y="160" width="144" height="88" rx="8"/>
  <text class="label" x="624" y="210" text-anchor="middle">Action request</text>

  <rect class="box" x="800" y="160" width="128" height="88" rx="8"/>
  <text class="label" x="864" y="210" text-anchor="middle">Desktop</text>

  <line class="path" x1="216" y1="204" x2="320" y2="204"/>
  <path class="arrow" d="M 312 199 L 320 204 L 312 209 Z"/>
  <text class="arrow-label" x="268" y="188" text-anchor="middle">Send screen</text>

  <line class="path" x1="448" y1="204" x2="552" y2="204"/>
  <path class="arrow" d="M 544 199 L 552 204 L 544 209 Z"/>
  <text class="arrow-label" x="500" y="188" text-anchor="middle">Choose</text>

  <line class="path" x1="696" y1="204" x2="800" y2="204"/>
  <path class="arrow" d="M 792 199 L 800 204 L 792 209 Z"/>
  <text class="arrow-label" x="748" y="188" text-anchor="middle">Send</text>

  <line class="path" x1="864" y1="248" x2="864" y2="320"/>
  <line class="path" x1="864" y1="320" x2="144" y2="320"/>
  <line class="path" x1="144" y1="320" x2="144" y2="256"/>
  <path class="arrow" d="M 139 256 L 144 248 L 149 256 Z"/>
  <text class="arrow-label" x="504" y="308" text-anchor="middle">Capture updated screen</text>
</svg>
