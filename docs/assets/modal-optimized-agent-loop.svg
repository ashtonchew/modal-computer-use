<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">One-time setup feeds the repeated computer-use loop</title>
  <desc id="desc">A one-time create and connect stage starts a repeated loop from the current screen to the model, an action request, the desktop, and back to the next screenshot.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.4; }
      .setup { fill: #233528; stroke: #91B89A; stroke-width: 1.4; }
      .label, .small, .group, .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { fill: #F1F4EF; font-size: 16px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 13px; }
      .group { fill: #AACCB0; font-size: 14px; font-weight: 600; }
      .arrow-label { fill: #B9C2B8; font-size: 13px; font-weight: 500; }
      .path { fill: none; stroke: #91B89A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="360"/>

  <rect class="setup" x="32" y="24" width="176" height="72" rx="8"/>
  <text class="label" x="120" y="53" text-anchor="middle">Create and connect</text>
  <text class="small" x="120" y="77" text-anchor="middle">One-time setup</text>
  <line class="path" x1="120" y1="96" x2="120" y2="160" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="136" y="132">Start session</text>

  <text class="group" x="272" y="136">Repeat each turn</text>

  <rect class="box" x="32" y="160" width="176" height="80" rx="8"/>
  <text class="label" x="120" y="206" text-anchor="middle">Current screen</text>

  <rect class="box" x="272" y="160" width="176" height="80" rx="8"/>
  <text class="label" x="360" y="206" text-anchor="middle">Model</text>

  <rect class="box" x="512" y="160" width="176" height="80" rx="8"/>
  <text class="label" x="600" y="206" text-anchor="middle">Action request</text>

  <rect class="box" x="752" y="160" width="176" height="80" rx="8"/>
  <text class="label" x="840" y="206" text-anchor="middle">Desktop</text>

  <line class="path" x1="208" y1="200" x2="272" y2="200" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="240" y="183" text-anchor="middle">Send screenshot</text>

  <line class="path" x1="448" y1="200" x2="512" y2="200" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="480" y="183" text-anchor="middle">Choose action</text>

  <line class="path" x1="688" y1="200" x2="752" y2="200" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="720" y="183" text-anchor="middle">Execute action</text>

  <path class="path" d="M840 240 V320 H120 V240" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="480" y="307" text-anchor="middle">Capture next screenshot</text>
</svg>
