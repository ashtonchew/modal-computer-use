<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="576" viewBox="0 0 1152 576" role="img" aria-labelledby="title desc">
  <title id="title">Pixel change is a wake signal, not an application-readiness test</title>
  <desc id="desc">The detector records a baseline hash, runs an action, waits for an XDamage signal or poll, captures a new frame, and returns that same frame when its pixels differ. Blinks, cursors, animation, repaints, or intermediate frames can stop the detector early, so the caller still checks a workload-specific readiness predicate.</desc>
  <defs>
    <style>
      .bg { fill: #101411; }
      .box { fill: #1C231D; stroke: #657066; stroke-width: 1.3; }
      .decision { fill: #1C231D; stroke: #91B89A; stroke-width: 1.5; }
      .result { fill: #233528; stroke: #91B89A; stroke-width: 1.5; }
      .label, .decision-label, .small, .group, .metric, .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { fill: #F1F4EF; font-size: 14px; font-weight: 600; }
      .decision-label { fill: #F1F4EF; font-size: 15px; font-weight: 600; }
      .small { fill: #B9C2B8; font-size: 12px; }
      .group { fill: #AACCB0; font-size: 17px; font-weight: 700; }
      .metric { fill: #F1F4EF; font-size: 22px; font-weight: 700; }
      .arrow-label { fill: #B9C2B8; font-size: 12px; font-weight: 500; }
      .path { fill: none; stroke: #91B89A; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .path-neutral { fill: none; stroke: #8A948B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-sage" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#91B89A"/></marker>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8A948B"/></marker>
  </defs>
  <rect class="bg" width="1152" height="576"/>
  <text class="group" x="32" y="36">Detect the first changed frame</text>

  <rect class="box" x="32" y="64" width="160" height="96" rx="8"/>
  <text class="label" x="112" y="105" text-anchor="middle">Record baseline</text>
  <text class="small" x="112" y="133" text-anchor="middle">Hash A</text>
  <rect class="box" x="280" y="64" width="160" height="96" rx="8"/>
  <text class="label" x="360" y="117" text-anchor="middle">Run action</text>
  <rect class="box" x="528" y="64" width="160" height="96" rx="8"/>
  <text class="label" x="608" y="105" text-anchor="middle">Wait for signal</text>
  <text class="small" x="608" y="133" text-anchor="middle">XDamage or poll</text>
  <rect class="box" x="776" y="64" width="160" height="96" rx="8"/>
  <text class="label" x="856" y="105" text-anchor="middle">Capture frame</text>
  <text class="small" x="856" y="133" text-anchor="middle">Hash B</text>
  <line class="path" x1="192" y1="112" x2="280" y2="112" marker-end="url(#arrow-sage)"/>
  <line class="path" x1="440" y1="112" x2="528" y2="112" marker-end="url(#arrow-sage)"/>
  <line class="path" x1="688" y1="112" x2="776" y2="112" marker-end="url(#arrow-sage)"/>

  <path class="path" d="M856 160 V200 H608 V224" marker-end="url(#arrow-sage)"/>
  <path class="decision" d="M608 224 L680 296 L608 368 L536 296 Z"/>
  <text class="decision-label" x="608" y="290" text-anchor="middle">Pixels</text>
  <text class="decision-label" x="608" y="313" text-anchor="middle">changed?</text>
  <rect class="result" x="776" y="248" width="280" height="96" rx="8"/>
  <text class="metric" x="916" y="288" text-anchor="middle">65 ms</text>
  <text class="small" x="916" y="319" text-anchor="middle">Return the same verified frame</text>
  <line class="path" x1="680" y1="296" x2="776" y2="296" marker-end="url(#arrow-sage)"/>
  <text class="arrow-label" x="728" y="276" text-anchor="middle">Changed</text>

  <path class="path-neutral" d="M536 296 H448 V200 H568 V160" marker-end="url(#arrow-neutral)"/>
  <text class="arrow-label" x="492" y="276" text-anchor="middle">Keep waiting</text>
  <path class="path-neutral" d="M916 344 V392 H652 V432" marker-end="url(#arrow-neutral)"/>
  <rect class="box" x="528" y="432" width="248" height="104" rx="8"/>
  <text class="label" x="652" y="468" text-anchor="middle">Possible early stop</text>
  <text class="small" x="652" y="496" text-anchor="middle">Blink, cursor, animation,</text>
  <text class="small" x="652" y="516" text-anchor="middle">repaint, or intermediate paint</text>
  <line class="path-neutral" x1="776" y1="484" x2="872" y2="484" marker-end="url(#arrow-neutral)"/>
  <rect class="box" x="872" y="432" width="248" height="104" rx="8"/>
  <text class="label" x="996" y="475" text-anchor="middle">Caller checks readiness</text>
  <text class="small" x="996" y="505" text-anchor="middle">Workload predicate</text>
</svg>
